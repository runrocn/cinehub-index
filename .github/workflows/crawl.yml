# 每天定时采集各资源站，生成 data/index.json 并自动提交
name: crawl-index

on:
  schedule:
    # 北京时间每天早上 6:00（UTC 22:00）
    - cron: '0 22 * * *'
  workflow_dispatch: {} # 允许手动触发

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run crawler
        env:
          CRAWL_PAGES_PER_CATEGORY: '10'
          CRAWL_CONCURRENCY: '4'
        run: node scripts/crawl.mjs

      - name: Commit updated index
        run: |
          git config user.name "cinehub-bot"
          git config user.email "cinehub-bot@users.noreply.github.com"
          git add data/index.json
          git diff --staged --quiet || git commit -m "chore: update index $(date -u +%Y-%m-%d)"
          git push
